<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>{{ config.bot_name }}管理登录</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../static/icon.svg" type="image/x-icon">
    <link href="../static/css/bootstrap.min.css" rel="stylesheet" type="text/css">
    <link href="../static/css/custom-style.css" rel="stylesheet" type="text/css">
</head>
<body class="admin-page admin-login-page">
    <div class="background-image"></div>
    <main id="content" class="admin-content">
        <section class="container admin-shell">
            <header class="admin-hero">
                <div class="brand-mark"><img src="../static/yuiChyan.jpg" alt="YuiChyanBot"></div>
                <div>
                    <span class="eyebrow">YuiChyanBot / ADMIN</span>
                    <h1>{{ config.bot_name }}管理登录</h1>
                    <p>登录后管理各个群组的服务功能开关。</p>
                </div>
            </header>
            <div class="admin-login-card">
                <div class="admin-card-heading">
                    <span class="eyebrow">安全入口</span>
                    <h2>验证管理员身份</h2>
                </div>
                <form method="post" action="/login" class="admin-login-form">
                    <input type="hidden" name="csrf_token" value="{{ config.csrf_token }}">
                    <label for="searchInput">用户名</label>
                    <div class="admin-input-wrap">
                        <input id="searchInput" name="username" placeholder="请输入用户名" type="password" autocomplete="current-password" required>
                        <button type="button" class="reset-button" onclick="document.getElementById('searchInput').value = '';" aria-label="清除输入" title="清除输入">×</button>
                    </div>
                    <button type="submit" class="admin-primary-button">下一步 <span aria-hidden="true">→</span></button>
                </form>
            </div>
            <footer class="help-footer"><a href="/help">返回帮助中心</a></footer>
        </section>
    </main>
</body>
</html>
