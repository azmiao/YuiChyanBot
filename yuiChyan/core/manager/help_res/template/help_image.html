<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>命令文档</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 基础 CSS -->
    <style>{{ md_css_content }}</style>
    <style>
        :root {
            color-scheme: light;
            --ink: #243247;
            --muted: #718096;
            --accent: #5b7cfa;
            --line: #e7ecf4;
        }
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #eef3ff 0%, #f8faff 52%, #edf8f7 100%);
            margin: 0;
            padding: 34px 24px 58px;
            color: var(--ink);
            font-family: "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
        }
        .markdown-card {
            width: min(920px, 100%);
            margin: 0 auto;
            padding: 42px 48px 38px;
            background: rgba(255, 255, 255, .96);
            border: 1px solid rgba(255, 255, 255, .8);
            border-radius: 24px;
            box-shadow: 0 20px 55px rgba(47, 64, 99, .14);
            text-align: left;
            font-size: 17px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }
        h1, h2, h3, h4, h5, h6 {
            color: var(--ink);
            line-height: 1.4;
            font-weight: 700;
            margin: 1.6em 0 .7em;
        }
        h1 { font-size: 32px; letter-spacing: -.5px; }
        h2 { font-size: 24px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
        h3 { font-size: 20px; }
        h4, h5, h6 { font-size: 17px; }
        .document-content > :first-child { margin-top: 0; }
        .document-content > :last-child { margin-bottom: 0; }
        p, ul, ol { margin: 0 0 18px; }
        ul, ol { padding-left: 1.5em; }
        li { margin: 6px 0; }
        li > ul, li > ol { margin-bottom: 0; }
        li::marker { color: var(--accent); }
        a { color: #4664c4; text-decoration: none; border-bottom: 1px solid #cbd6fa; }
        hr { margin: 28px 0; border: 0; border-top: 1px solid var(--line); }
        code { font-family: Consolas, "Courier New", monospace; font-size: .88em; }
        :not(pre) > code { padding: 3px 6px; border-radius: 5px; background: #eef2fc; color: #425ca4; }
        pre code { padding: 0; background: none; color: inherit; }
        pre span { color: inherit !important; background: none !important; }
        table {
            width: 100%;
            table-layout: fixed;
            margin: 24px 0;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 16px;
            overflow-wrap: anywhere;
        }
        th, td { border-bottom: 1px solid var(--line); padding: 12px 16px; }
        th { background: #f1f5ff; color: #40548a; font-weight: 700; }
        tr:last-child td { border-bottom: 0; }
        pre {
            text-align: left;
            color: #e8eefc;
            background: #202a3b !important;
            padding: 20px 22px;
            border-radius: 14px !important;
            overflow: auto;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
        }
        blockquote { margin: 22px 0; padding: 12px 18px; border-left: 4px solid var(--accent); background: #f5f7ff; color: var(--muted); }
        img { max-width: 100%; height: auto; border-radius: 12px; }
        @media (max-width: 640px) { body { padding: 16px 10px 44px; } .markdown-card { padding: 28px 22px; border-radius: 18px; } }
        {# 页脚随正文排列，避免长文截图中水印覆盖内容 #}
        .document-footer {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px 24px;
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
            color: #7d899c;
            font-size: 12px;
            line-height: 1.6;
            letter-spacing: 0;
        }
        .document-footer strong {
            color: #64748b;
            font-weight: 500;
        }
        @media (max-width: 480px) {
            .document-footer {
                justify-content: center;
                column-gap: 16px;
                margin-top: 24px;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <!-- 命令文档内容 -->
    <main class="markdown-card">
        <article class="document-content">
            {{ help_body | safe }}
        </article>
        <footer class="document-footer">
            <span>Power By <strong>YuiChyanBot</strong></span>
            <span>Author: <strong>AZMIAO</strong></span>
        </footer>
    </main>
</body>

</html>
